version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      opentelemetry:
        patterns: ["@opentelemetry/*", "@vercel/otel"]
    ignore:
      # tsup's type bundling needs the TypeScript 6 compiler API; TypeScript 7 ships none.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
