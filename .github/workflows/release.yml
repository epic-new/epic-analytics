name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Release is a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # Trusted publishing: npm exchanges this job's OIDC token for a one-time
      # credential, so no npm token is stored anywhere, and provenance is
      # attached automatically. Needs npm 11.5.1+.
      - run: npm install -g npm@11.21.2
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run check:package
      - name: Publish
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: npm publish --access public $([ "$PRERELEASE" = "true" ] && echo "--tag next")
